[project]
name = "rapporteur-workers"
version = "0.1.0"
description = "Очередь PostgreSQL и исполнители этапов «Репортёра»"
requires-python = ">=3.12,<3.13"
dependencies = ["rapporteur-pipeline", "psycopg[binary]>=3.3,<3.4"]

[project.scripts]
rapporteur-worker = "rapporteur_workers.cli:main"

[dependency-groups]
dev = ["mypy>=2.4,<2.5", "pytest>=9.1,<9.2", "ruff>=0.17,<0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rapporteur_workers"]

[tool.uv]
exclude-newer = "2026-10-20T00:00:00Z"

[tool.uv.sources]
rapporteur-pipeline = { path = "../pipeline", editable = true }
rapporteur-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rapporteur_workers", "rapporteur_pipeline", "rapporteur_contracts"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
