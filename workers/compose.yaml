name: rapporteur-workers-test

services:
  py:
    build:
      context: ..
      dockerfile: workers/Dockerfile
    image: rapporteur-workers-dev:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /repo/workers
    volumes:
      - .:/repo/workers
      - ../pipeline:/repo/pipeline:ro
      - ../contracts:/repo/contracts:ro
    environment:
      HOME: /tmp
      TEST_DATABASE_URL: "host=db dbname=postgres user=rapporteur password=test-only"
    networks: [test]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: rapporteur
      POSTGRES_PASSWORD: test-only
    tmpfs: [/var/lib/postgresql/data]
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rapporteur -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  test:
    internal: true
