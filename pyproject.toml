[project]
name = "rapporteur"
version = "0.2.0"
description = "«Репортёр»: справки по материалам научных конференций (docs/spec.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio>=4.11,<5",
    "docxtpl>=0.20.2,<0.21",
    "fastapi>=0.150,<0.151",
    "jinja2>=3.1,<4",
    "pillow>=13.0,<13.1",
    "pydantic>=2.13,<2.14",
    "pymorphy3>=2.0.6,<2.1",
    "pypdfium2>=5.14,<5.15",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0.2,<1.1",
    "pyyaml>=6.0,<7",
    "rapidfuzz>=3.14,<3.15",
    "razdel>=0.5,<0.6",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    # TestClient из Starlette 1.x требует httpx2 вместо httpx.
    "httpx2>=2,<3",
    "mypy>=2.4,<2.5",
    "pytest>=9.1,<9.2",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12,<6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rapporteur"]

[tool.uv]
# Только версии старше двух недель на момент блокировки; дату сдвигать вместе с make lock.
exclude-newer = "2026-10-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
# RUF001–003 принимают кириллицу за символы-двойники латиницы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rapporteur"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# У этих библиотек нет полных аннотаций типов.
module = [
    "docx", "docx.*", "docxtpl", "docxtpl.*", "pptx", "pptx.*",
    "pymorphy3", "pymorphy3.*", "pypdfium2", "pypdfium2.*", "razdel", "razdel.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
