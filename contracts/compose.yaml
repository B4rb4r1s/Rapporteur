name: rapporteur-contracts

x-host-user: &host-user "${HOST_UID:-1000}:${HOST_GID:-1000}"

services:
  py:
    build: .
    image: rapporteur-contracts-dev:local
    user: *host-user
    working_dir: /repo/contracts
    volumes:
      - .:/repo/contracts
    environment:
      HOME: /tmp

  ts:
    image: node:22-slim@sha256:4b150b48b4116e2a22f2c39cc27025fbf4f153e2078fd3b14d159fdb5c7279da
    user: *host-user
    working_dir: /repo/contracts
    volumes:
      - .:/repo/contracts
    environment:
      HOME: /tmp
