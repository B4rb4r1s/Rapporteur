[project]
name = "rapporteur-contracts"
dynamic = ["version"]
description = "Контракты данных проекта «Репортёр»: Pydantic-модели, JSON Schema, TS-типы"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13,<2.14"]

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>.+)$"

[tool.hatch.build.targets.wheel]
packages = ["src/rapporteur_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
# RUF001–003 принимают кириллицу за символы-двойники латиницы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rapporteur_contracts"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
