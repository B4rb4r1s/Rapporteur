[project]
name = "rapporteur-backend"
version = "0.1.0"
description = "Backend «Репортёра»: FastAPI (spec §8, §11)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapporteur-contracts",
    "rapporteur-pipeline",
    "rapporteur-workers",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.17,<2",
    "anyio>=4.11,<5",
    "psycopg[binary]>=3.3,<3.4",
    "fastapi>=0.150,<0.151",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    # TestClient из Starlette 1.x требует httpx2 вместо httpx.
    "httpx2>=2,<3",
    "mypy>=2.4,<2.5",
    "pytest>=9.1,<9.2",
    "ruff>=0.17,<0.18",
    "types-pyyaml>=6.0.12,<6.1",
]

[project.scripts]
rapporteur-backend = "rapporteur_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rapporteur_backend"]

[tool.uv]
# Только версии старше двух недель на момент блокировки; дату сдвигать вместе с make lock.
exclude-newer = "2026-10-20T00:00:00Z"

[tool.uv.sources]
rapporteur-contracts = { path = "../contracts", editable = true }
rapporteur-pipeline = { path = "../pipeline", editable = true }
rapporteur-workers = { path = "../workers", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
# RUF001–003 принимают кириллицу за символы-двойники латиницы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rapporteur_backend", "rapporteur_contracts", "rapporteur_pipeline", "rapporteur_workers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Проверять типы аргументов конструкторов моделей, а не принимать Any.
init_typed = true
init_forbid_extra = true
