name: rapporteur-backend

x-host-user: &host-user "${HOST_UID:-1000}:${HOST_GID:-1000}"

x-py: &py
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: rapporteur-backend-dev:local
  user: *host-user
  working_dir: /repo/backend
  volumes:
    - .:/repo/backend
    - ../contracts:/repo/contracts:ro
    - ../workers:/repo/workers:ro
  environment:
    HOME: /tmp
    TEST_DATABASE_URL: "host=db dbname=postgres user=rapporteur password=backend-dev-only"

services:
  py:
    <<: *py
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *py
    profiles: [run]
    environment: &database-env
      HOME: /tmp
      PGHOST: db
      PGDATABASE: rapporteur
      PGUSER: rapporteur
      PGPASSWORD: backend-dev-only
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy
    command: ["uvicorn", "rapporteur_backend.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8000}:8000"

  migrate:
    <<: *py
    profiles: [tools]
    environment: *database-env
    command: [rapporteur-backend, migrate]
    networks: [backend]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: rapporteur
      POSTGRES_PASSWORD: backend-dev-only
      POSTGRES_DB: rapporteur
    networks: [backend]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rapporteur -d rapporteur"]
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  backend:
    internal: true

volumes:
  postgres:
