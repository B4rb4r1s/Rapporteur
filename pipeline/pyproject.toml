[project]
name = "rapporteur-pipeline"
version = "0.1.0"
description = "Этапы конвейера «Репортёра» (spec §6, ADR-007): без веба и БД"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rapporteur-contracts",
    "pillow>=13.0,<13.1",
    "pypdfium2>=5.14,<5.15",
    "python-pptx>=1.0.2,<1.1",
]

[project.scripts]
rapporteur = "rapporteur_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<2.5",
    "pytest>=9.1,<9.2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rapporteur_pipeline"]

[tool.uv]
# Только версии старше двух недель на момент блокировки; дату сдвигать вместе с make lock.
exclude-newer = "2026-10-20T00:00:00Z"

[tool.uv.sources]
rapporteur-contracts = { path = "../contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "RUF"]
# RUF001–003 принимают кириллицу за символы-двойники латиницы.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["rapporteur_pipeline", "rapporteur_contracts"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# У python-pptx и pypdfium2 нет полных аннотаций типов.
module = ["pptx", "pptx.*", "pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
