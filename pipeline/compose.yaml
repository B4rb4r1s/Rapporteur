name: rapporteur-pipeline

x-py: &py
  build:
    context: ..
    dockerfile: pipeline/Dockerfile
  image: rapporteur-pipeline-dev:local
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /repo/pipeline
  volumes:
    - .:/repo/pipeline
    - ../contracts:/repo/contracts:ro
    - ../templates:/repo/templates:ro
    - ../prompts:/repo/prompts:ro
    # Материалы для `make run` и `make report`; по умолчанию пустой каталог.
    - ${RAPPORTEUR_INPUT:-./.empty}:/input:ro
    - ${RAPPORTEUR_DATA:-./.rapporteur-data}:/data
  environment:
    HOME: /tmp

services:
  # Парсеры и LibreOffice работают без сети и не от root (spec §10).
  py:
    <<: *py
    network_mode: none

  # Этапы с LLM: только внутренняя сеть сервиса Ollama, без выхода наружу (ADR-010).
  # Сервис поднимается отдельно: deploy/ollama/compose.yaml.
  llm:
    <<: *py
    profiles: [llm]
    networks: [inference]
    environment:
      HOME: /tmp
      OLLAMA_URL: http://ollama:11434

networks:
  inference:
    external: true
    name: rapporteur-ollama_inference
